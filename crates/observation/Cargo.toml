[package]
name = "observation"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "observation-summary"
path = "src/bin/observation-summary.rs"

[dependencies]
common = { version = "0.1.0", path = "../common" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["formatting", "parsing", "macros"] }
# Pin below 1.51: align with gateway; tokio 1.51+ may miss macros in sparse indexes.
tokio = { version = "=1.48.0", features = ["net", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
zenoh = "1.9"

[dev-dependencies]
tempfile = "3.27.0"
