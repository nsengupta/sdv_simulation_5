[package]
name = "tui_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
# Internal workspace dependencies
common = { path = "../common" }

# TUI Layer dependencies
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
