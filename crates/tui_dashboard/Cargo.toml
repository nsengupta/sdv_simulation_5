[package]
name = "tui_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
common = { path = "../common" }
observation = { path = "../observation" }
ratatui = "0.26"
tokio = { version = "1", features = ["full"] }
crossterm = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3"
